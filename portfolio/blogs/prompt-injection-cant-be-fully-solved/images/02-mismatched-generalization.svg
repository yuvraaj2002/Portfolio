<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"><rect width="800" height="480" fill="#FAFAF7"/><text x="40" y="44" font-family="IBM Plex Mono" font-size="10" font-weight="500" fill="#9AA3AC" text-anchor="start" letter-spacing="1.2"><tspan x="40" dy="0">FIG 2 · MISMATCHED GENERALIZATION</tspan></text><text x="40" y="70" font-family="Inter" font-size="20" font-weight="600" fill="#1E2A36" text-anchor="start" letter-spacing="0"><tspan x="40" dy="0">The model understands more than its guards were trained on</tspan></text><rect x="40" y="110" width="720" height="320" rx="18" fill="#EAF0F7" stroke="#B7C9DE" stroke-width="1.2" opacity="1"/><text x="64" y="138" font-family="Inter" font-size="13" font-weight="600" fill="#3E6A9E" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">What the LLM understands</tspan></text><text x="64" y="156" font-family="Inter" font-size="11" font-weight="400" fill="#66707A" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">learned in pretraining, from a huge slice of the internet</tspan></text><rect x="64" y="178" width="272" height="226" rx="14" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1.2" opacity="1"/><text x="84" y="204" font-family="Inter" font-size="12" font-weight="600" fill="#1E2A36" text-anchor="start" letter-spacing="0"><tspan x="84" dy="0">What safety training and the</tspan></text><text x="84" y="220" font-family="Inter" font-size="12" font-weight="600" fill="#1E2A36" text-anchor="start" letter-spacing="0"><tspan x="84" dy="0">input classifier mostly saw</tspan></text><rect x="84" y="246" width="232" height="28" rx="6" fill="#FFFFFF" stroke="#C9CFD6" stroke-width="1" opacity="1"/><circle cx="100" cy="260" r="6.5" fill="#EAF0F7" stroke="#3E6A9E" stroke-width="1"/><path d="M97.15625,260.1625 L99.1875,262.275 L103.0875,257.8875" stroke="#3E6A9E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="264.5" font-family="Inter" font-siz